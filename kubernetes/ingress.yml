apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kyuka-web-ingress-dev
  namespace: witeseb
status:
  loadBalancer:
    ingress:
      - ip: 127.0.0.1
spec:
  ingressClassName: public
  rules:
    - host: kyuka-dev.witeseb.website
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kyuka-web-svc-dev
                port:
                  number: 3000
